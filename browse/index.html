<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smart-able</title>
<style>
/* Layout: full-height app — brand-teal header band with tabs, scrolling content pane per tab.
   Theming: EarthRanger design system (DESIGN.md) — semantic tokens, light/dark inverts
   (warm off-white -> deep teal). Data colors use ER's categorical scale (mode-stable).
   Variable names kept; values mapped to ER semantic tokens. */
:root {
  --bg: #faf2e9;        /* UI/Background/Secondary (warm off-white) */
  --surface: #ffffff;   /* UI/Background/Elevated Component */
  --ink: #0a3235;       /* UI/Text/Primary */
  --ink-2: #105257;     /* UI/Text/Secondary (Teal T100) */
  --ink-3: #767676;     /* UI/Text/Disabled, UI/Icons */
  --line: #dddddd;      /* UI/Divider Lines */
  --accent: #0f865d;    /* UI/CTA Primary (brand green) */
  --accent-ink: #ffffff;/* UI/Text/Primary Reversed */
  --chip: #e7eeee;      /* Teal T10 */
  --brand: #105257;     /* Teal T100 — nav/header brand accent */
  --brand-ink: #faf2e9; /* off-white text on brand teal */
  --track: #e76826;     /* UI/Patrol Status/Track Line */
  /* ER Data/Categorical 1-10 (mode-stable, used in order) */
  --cat1: #3e35a3; --cat2: #488a00; --cat3: #00958f; --cat4: #b62879; --cat5: #c6880c;
  --cat6: #00d0c8; --cat7: #78d811; --cat8: #5c4fe7; --cat9: #f4db20; --cat10: #ed3ea2;
  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --head: "PP Telegraf", "Roboto", system-ui, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #032629; --surface: #0a3235; --ink: #ffffff; --ink-2: #faf2e9;
    --ink-3: #888b8d; --line: #63666a; --accent: #0fcb8c; --accent-ink: #0a3235;
    --chip: #105257; --brand: #0a3235; --brand-ink: #ffffff; --track: #e76826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #032629; --surface: #0a3235; --ink: #ffffff; --ink-2: #faf2e9;
  --ink-3: #888b8d; --line: #63666a; --accent: #0fcb8c; --accent-ink: #0a3235;
  --chip: #105257; --brand: #0a3235; --brand-ink: #ffffff; --track: #e76826;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
#app { display: flex; flex-direction: column; height: 100%; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 16px; background: var(--brand); color: var(--brand-ink);
}
.brand { display: flex; align-items: center; gap: 9px; }
.brand svg { width: 22px; height: 22px; display: block; flex: none; }
.brand .acorn { color: #0fcb8c; } /* acorn mark reads on teal in both modes */
header h1 { font-family: var(--head); font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.1px; }
header h1 span { color: var(--brand-ink); opacity: 0.6; font-weight: 400; font-family: var(--sans); }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button {
  display: inline-flex; align-items: center; gap: 6px;
  border: 0; background: none; color: var(--brand-ink); font: 500 13.5px var(--sans);
  padding: 7px 11px; border-radius: 7px; cursor: pointer; opacity: 0.8;
}
nav button .mi { color: inherit; font-size: 18px; }
nav button:hover { background: rgba(255,255,255,0.12); opacity: 1; }
nav button.on { background: var(--accent); color: var(--accent-ink); opacity: 1; }
#caSel {
  margin-left: auto; background: rgba(255,255,255,0.12); color: var(--brand-ink);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 7px; padding: 6px 8px; font: 13px var(--sans);
  color-scheme: dark; /* teal header is dark-ish in both modes -> legible dropdown */
}
#caSel option { color: var(--ink); background: var(--surface); }
main { flex: 1; overflow: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 1200px; margin: 0 auto; }
h2 { font-family: var(--head); font-size: 15px; font-weight: 700; margin: 22px 0 10px; }
h2:first-child { margin-top: 0; }
.muted { color: var(--ink-2); }
.tiny { font-size: 12px; color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
/* Material Design Icons (ER icon library 1, Outlined) — ligature glyphs */
.mi { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal;
  line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap;
  display: inline-block; vertical-align: middle; font-size: 18px; color: var(--ink-3); /* UI/Icons */
  -webkit-font-feature-settings: "liga"; font-feature-settings: "liga"; -webkit-font-smoothing: antialiased;
  user-select: none; flex: none; }
/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile b { display: block; font-family: var(--head); font-size: 26px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.tile span { color: var(--ink-2); font-size: 12.5px; }
/* panels & tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 11.5px;
     text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click, div.click { cursor: pointer; }
tr.click:hover td, div.click:hover { background: var(--chip); }
.tableWrap { overflow-x: auto; }
input[type="search"] {
  width: 100%; max-width: 360px; box-sizing: border-box; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 13px var(--sans);
}
.searchwrap { position: relative; display: inline-block; width: 100%; max-width: 360px; }
.searchwrap .mi { position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  font-size: 18px; pointer-events: none; }
.searchwrap input[type="search"] { max-width: none; padding-left: 33px; }
.filterbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; }
.tfwrap { display: contents; } /* children join the filterbar's flex flow */
.filterbar input, .filterbar select {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; font: 13px var(--sans);
}
.filterbar .searchwrap { flex: 1; min-width: 200px; max-width: 340px; }
.filterbar #tfRange, .filterbar #tfAround { display: inline-flex; align-items: center; gap: 6px; }
.filterbar #obsCount { margin-left: auto; }
button.more, button.ghost {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--chip); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 14px; font: 600 13px var(--sans); cursor: pointer; margin-top: 10px;
}
button.more .mi, button.ghost .mi { font-size: 18px; color: inherit; }
.pill { display: inline-block; background: var(--chip); border-radius: 99px; padding: 1px 9px;
        font-size: 11.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.pill.lead { background: var(--accent); color: var(--accent-ink); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.cols { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
/* category tree */
.tree div.nd { padding: 3px 0 3px 0; cursor: pointer; border-radius: 6px; }
.tree div.nd:hover { background: var(--chip); }
.tree div.nd.sel { background: var(--accent); color: var(--accent-ink); padding-left: 6px; }
.tree .cnt { color: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.tree div.nd.sel .cnt { color: var(--accent-ink); opacity: 0.8; }
/* map */
#mapBox { position: relative; }
canvas.map { width: 100%; border: 1px solid var(--line); border-radius: 10px;
             background: var(--surface); display: block; touch-action: none; cursor: grab; }
/* clickable waypoint rows in the patrol drawer */
.wprow { border-top: 1px solid var(--line); padding: 8px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; }
.wprow:hover { background: var(--chip); }
.wprow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.wprow .wphead { display: flex; align-items: center; gap: 6px; }
.wprow .go { margin-left: auto; font-size: 20px; }
.wprow:hover .go { color: var(--accent); }
.obsrow { display: flex; align-items: flex-start; gap: 6px; }
.obsrow .rowbody { flex: 1; min-width: 0; }
.obsrow .go { margin: 4px 0 0 auto; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 2px 0 8px;
         font-size: 12.5px; color: var(--ink-2); }
.crumb .mi { font-size: 16px; }
.mapframe { position: relative; }
.mapctrl { position: absolute; top: 8px; right: 8px; z-index: 5; display: inline-flex;
           align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line);
           border-radius: 8px; padding: 3px 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
.mapctrl .mi { font-size: 16px; }
.mapctrl select { background: var(--surface); color: var(--ink); border: 0; font: 12px var(--sans);
                  cursor: pointer; outline: none; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink);
       border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px;
       box-shadow: 0 4px 14px rgba(0,0,0,0.18); max-width: 280px; z-index: 50; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0; font-size: 12.5px; }
.legend button { background: none; border: 0; color: var(--ink-2); font: 12.5px var(--sans);
                 cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.legend button.off { opacity: 0.35; }
/* detail drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 94vw);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,0.22);
  z-index: 40; overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(20px + env(safe-area-inset-bottom, 0px));
}
#drawer h3 { font-family: var(--head); margin: 4px 0 2px; font-size: 16px; font-weight: 700; }
#drawer .x { position: sticky; top: 0; float: right; display: inline-flex; align-items: center; gap: 5px;
  background: var(--chip); border: 1px solid var(--line);
  color: var(--ink); border-radius: 8px; padding: 4px 11px; cursor: pointer; font: 700 13px var(--sans); }
#drawer .x .mi { font-size: 17px; color: inherit; }
.legend #bmSel { font: 13px var(--sans); background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; margin: 10px 0; }
.kv div:nth-child(odd) { color: var(--ink-3); }
.kv div { min-width: 0; overflow-wrap: break-word; }
/* bar charts */
.bars svg { display: block; width: 100%; height: auto; }
.bars text { font: 11.5px var(--sans); fill: var(--ink-2); }
.bars text.v { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bars rect.bg:hover { fill: var(--chip); }
.schema-notes li { margin: 5px 0; }
pre.mermaid { overflow-x: auto; }
#loading { padding: 40px; text-align: center; color: var(--ink-2); }
.photos { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.photos img { height: 96px; max-width: 160px; object-fit: cover; border-radius: 8px;
              border: 1px solid var(--line); display: block; cursor: zoom-in; }
.photos a.pill { cursor: pointer; text-decoration: none; }
/* attachment preview modal */
#modal { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 12, 0.82);
         display: flex; flex-direction: column; }
#modal .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; color: #fff; }
#modal .bar .name { font: 600 13px var(--mono); overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; min-width: 0; }
#modal .bar a, #modal .bar button {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.14); color: #fff; border: 0; border-radius: 7px;
  padding: 6px 12px; font: 600 12.5px var(--sans); cursor: pointer; text-decoration: none; white-space: nowrap; }
#modal .bar .mi { color: #fff; font-size: 18px; }
#modal .nav .mi { color: #fff; font-size: 26px; }
#modal .stage { flex: 1; display: flex; align-items: center; justify-content: center;
                min-height: 0; padding: 0 12px 12px; position: relative; }
#modal .stage img { max-width: 100%; max-height: 100%; border-radius: 8px; }
#modal .stage iframe { width: min(960px, 100%); height: 100%; border: 0; border-radius: 8px; background: #fff; }
#modal .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 26px;
  background: rgba(255,255,255,0.14); color: #fff; border: 0; border-radius: 10px;
  padding: 10px 14px; cursor: pointer; user-select: none; }
#modal .nav[disabled] { opacity: 0.25; cursor: default; }
#modal .nav.prev { left: 14px; } #modal .nav.next { right: 14px; }
#modal .count { color: rgba(255,255,255,0.7); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=block">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg class="acorn" viewBox="0 0 120 120" aria-hidden="true"><g fill="currentColor"><path d="M94.4,74.2v1.9c0,6.3-1.1,13.4-9.8,18.5L60,110,34.5,94.6c-8.9-5.6-8.9-15-8.9-18.5V74.3Z"/><polygon points="60 10 23.9 15.9 25.6 36.6 94.4 36.6 96.1 15.9 60 10"/><polygon points="86.2 42.2 25.6 42.2 25.6 67.9 86.2 67.9 86.2 42.2"/></g></svg>
      <h1>smart-able <span id="dbver"></span></h1>
    </div>
    <nav id="tabs"></nav>
    <select id="caSel" aria-label="Conservation area filter"></select>
  </header>
  <main><div class="wrap" id="view"><div id="loading">Loading data…</div></div></main>
</div>
<div id="tip" hidden></div>
<div id="drawer" hidden></div>
<div id="modal" hidden></div>

<script>
'use strict';
const $ = (s, el) => (el || document).querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// search input with a leading Material "search" icon; returns {wrap, inp}
function searchField(id, placeholder, value) {
  const wrap = el('span', 'searchwrap');
  wrap.innerHTML = '<span class="mi" aria-hidden="true">search</span>';
  const inp = el('input'); inp.type = 'search'; inp.id = id;
  inp.placeholder = placeholder; inp.value = value || '';
  wrap.appendChild(inp);
  return { wrap, inp };
}
const fmt = n => Number(n).toLocaleString('en-US');
// a real GPS fix: SMART stores missing positions as 0,0 placeholders
const hasGps = w => w.x != null && w.y != null && !(Math.abs(w.x) < 0.01 && Math.abs(w.y) < 0.01);

const D = {}; // loaded data
let CA = 'all';
let TAB = 'overview';
const ROOT_META = {}; // hkey root -> {label, color}
// ER Data/Categorical scale, used in order (no skipping, no substituting brand colors)
const SERIES = ['var(--cat1)','var(--cat2)','var(--cat3)','var(--cat4)','var(--cat5)',
                'var(--cat6)','var(--cat7)','var(--cat8)','var(--cat9)','var(--cat10)'];

async function getJSON(name) {
  const r = await fetch('data/' + name + '.json');
  if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
  return r.json();
}

async function boot() {
  try {
    const [meta, cats, patrols, bounds, emps, atts] = await Promise.all(
      ['meta','categories','patrols','boundaries','employees','attachments'].map(getJSON));
    D.meta = meta[0]; D.cats = cats; D.patrols = patrols; D.bounds = bounds;
    D.emps = emps; D.atts = atts;
    // optional: Profiles exists only when the backup has the i2 plugin's tables
    try { D.profiles = (await getJSON('profiles'))[0]; D.atts = D.atts.concat(await getJSON('profile_attachments')); }
    catch (e) { D.profiles = null; }
    if (!D.profiles) D.profiles = { types: [], entities: [], records: [] };
    try { D.tz = await getJSON('timezones'); } catch (e) { D.tz = null; } // optional (infer_timezones.py)
    $('#dbver').textContent = D.meta.db_version ? '· SMART database ' + D.meta.db_version : '';
    index();
    $('#loading').textContent = 'Loading waypoints and observations…';
    const [wps, obs] = await Promise.all([getJSON('waypoints'), getJSON('observations')]);
    D.wps = wps; D.obs = obs;
    indexHeavy();
    buildHeader();
    try { TAB = localStorage.getItem('tab') || 'overview'; } catch (e) {}
    const h = (location.hash || '').slice(1);
    if (['overview','patrols','map','observations','profiles','schema'].includes(h)) TAB = h;
    render();
  } catch (e) {
    $('#view').innerHTML = '<div class="panel">Could not load data: ' + esc(e.message) + '</div>';
  }
}

function index() {
  D.catBy = new Map(D.cats.map(c => [c.u, c]));
  D.caBy = new Map(D.meta.cas.map(c => [c.u, c]));
  D.caById = new Map(D.meta.cas.map(c => [c.id, c]));
  D.patrolBy = new Map(D.patrols.map(p => [p.u, p]));
  // root category groups -> ER categorical colors assigned in fixed (sorted) order
  const roots = [...new Set(D.cats.filter(c => !c.p).map(c => c.k.replace(/\.$/,'')))].sort();
  let i = 0;
  for (const r of roots) {
    const c = D.cats.find(x => !x.p && x.k.replace(/\.$/,'') === r);
    ROOT_META[r] = { label: c ? c.l : r, color: SERIES[i++ % SERIES.length] };
  }
  D.recBy = new Map(D.profiles.records.map(r => [r.u, r]));
  D.ptypeBy = new Map(D.profiles.types.map(t => [t.u, t]));
  // record uuid -> indexes of the entities linked to it (the link table is many-to-many)
  D.recEnts = new Map();
  D.profiles.entities.forEach((e, i) => (e.recs || []).forEach(u => {
    let l = D.recEnts.get(u); if (!l) D.recEnts.set(u, l = []);
    l.push(i);
  }));
  // attachment manifest: kind ('wp'|'ent'|'rec') + owner uuid -> decrypted file paths
  D.attBy = { wp: new Map(), ent: new Map(), rec: new Map() };
  for (const a of D.atts) {
    const m = D.attBy[a.k]; if (!m) continue;
    let l = m.get(a.id); if (!l) m.set(a.id, l = []);
    l.push(a.p);
  }
}

// photo strip: images load lazily; files missing from the backup remove themselves
function photoStrip(paths) {
  if (!paths || !paths.length) return null;
  const box = el('div', 'photos');
  paths.forEach((p, i) => {
    const name = p.split('/').pop();
    const a = el('a'); a.href = encodeURI(p); a.target = '_blank'; a.rel = 'noopener';
    a.onclick = ev => { ev.preventDefault(); openPreview(paths, i); };
    if (/\.(jpe?g|png|gif|webp)$/i.test(name)) {
      const img = el('img'); img.loading = 'lazy'; img.src = encodeURI(p);
      img.alt = name; img.title = name;
      img.onerror = () => { // file missing from the backup filestore
        a.remove();
        if (!box.children.length) { // nothing left: hide the strip and its section heading
          box.hidden = true;
          const h = box.previousElementSibling;
          if (h && h.tagName === 'H2') h.hidden = true;
        }
      };
      a.appendChild(img);
    } else {
      a.className = 'pill'; a.textContent = name; // pdf / doc chip
    }
    box.appendChild(a);
  });
  return box;
}

/* attachment preview modal: image or inline PDF, with prev/next */
let modalState = null;
function openPreview(paths, idx) {
  modalState = { paths, idx };
  drawModal();
}
function drawModal() {
  const { paths, idx } = modalState;
  const p = paths[idx], name = p.split('/').pop(), url = encodeURI(p);
  const isImg = /\.(jpe?g|png|gif|webp)$/i.test(name);
  const m = $('#modal');
  m.innerHTML = '<div class="bar"><span class="name">' + esc(name) + '</span>' +
    '<span class="count">' + (idx + 1) + ' / ' + paths.length + '</span>' +
    '<a href="' + url + '" target="_blank" rel="noopener"><span class="mi" aria-hidden="true">open_in_new</span>Open in new tab</a>' +
    '<button id="modalClose"><span class="mi" aria-hidden="true">close</span>Close</button></div>' +
    '<div class="stage">' +
    (isImg ? '<img src="' + url + '" alt="' + esc(name) + '">'
           : '<iframe src="' + url + '" title="' + esc(name) + '"></iframe>') +
    (paths.length > 1 ? '<button class="nav prev" id="modalPrev" aria-label="Previous"' + (idx === 0 ? ' disabled' : '') + '><span class="mi">chevron_left</span></button>' +

function indexHeavy() {
  D.wpBy = new Map(D.wps.map(w => [w.u, w]));
  D.obsByWp = new Map();
  for (const o of D.obs) {
    let a = D.obsByWp.get(o.w); if (!a) D.obsByWp.set(o.w, a = []);
    a.push(o);
  }
  D.wpsByPatrol = new Map();
  for (const w of D.wps) {
    if (!w.p) continue;
    let a = D.wpsByPatrol.get(w.p); if (!a) D.wpsByPatrol.set(w.p, a = []);
    a.push(w);
  }
  // root group per waypoint (first observation's category root) + true epoch
  // (wall-clock time anchored to the CA's inferred timezone)
  for (const w of D.wps) {
    const os = D.obsByWp.get(w.u);
    w.root = os && os.length ? rootOf(os[0].c) : null;
    w.ep = wallToEpoch(w.t, tzFor(w.ca));
  }
  // observation counts per category (direct)
  D.obsCountByCat = new Map();
  for (const o of D.obs) D.obsCountByCat.set(o.c, (D.obsCountByCat.get(o.c) || 0) + 1);
}
const rootOf = cu => { const c = D.catBy.get(cu); return c ? c.k.split('.')[0] : null; };
const caOk = caId => CA === 'all' || caId === CA;

/* ------- timezone handling -------
 * SMART timestamps are naive local wall-clock strings. timezones.json (from
 * infer_timezones.py, which uses timezonefinder on the waypoint GPS locations)
 * gives each CA an IANA zone; Intl converts wall time -> epoch in that zone. */
const tzFor = caId => D.tz ? (D.tz.byCa[caId] || D.tz.default) : null;
const smartMajor = () => parseInt(String(D.meta.db_version || '0'), 10) || 0;
// Profiles i_entity.date_created: local wall-clock time through SMART 7.x, UTC
// from SMART 8.0. Returns the creation date in the entity's CA timezone.
function profileCreated(e) {
  if (!e.created) return '';
  if (smartMajor() < 8) return e.created.slice(0, 10);
  const tz = tzFor(e.ca);
  const ms = Date.parse(e.created.replace(' ', 'T') + 'Z');
  if (!tz || isNaN(ms)) return e.created.slice(0, 10);
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms);
}
const tzFmtCache = {};
function tzOffsetAt(epochMs, tz) {
  let f = tzFmtCache[tz];
  if (!f) f = tzFmtCache[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const p = {};
  for (const x of f.formatToParts(epochMs)) p[x.type] = x.value;
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second)
         - Math.floor(epochMs / 1000) * 1000;
}
const tzOffCache = new Map(); // tz+day -> offset ms (offsets only change at DST edges)
function wallToEpoch(t, tz) {
  const iso = t.replace(' ', 'T');
  if (!tz) return Date.parse(iso); // no zone info: browser-local, as before
  const guess = Date.parse(iso + (iso.length <= 16 ? ':00' : '') + 'Z');
  if (isNaN(guess)) return NaN;
  const key = tz + iso.slice(0, 10);
  let off = tzOffCache.get(key);
  if (off === undefined) { off = tzOffsetAt(guess, tz); tzOffCache.set(key, off); }
  return guess - off;
}
const wpsFiltered = () => D.wps.filter(w => caOk(w.ca));

const tile = (n, label) => '<div class="tile"><b>' + fmt(n) + '</b><span>' + label + '</span></div>';

function yearChart(wps) {
  const by = {};
  for (const w of wps) { const y = w.t.slice(0, 4); if (y >= '2010') by[y] = (by[y] || 0) + 1; }
  const years = Object.keys(by).sort();
  const max = Math.max(1, ...Object.values(by));
  const bw = 100 / Math.max(years.length, 1);
  let s = '';
  years.forEach((y, i) => {
    const h = 110 * by[y] / max; // leaves headroom for the peak label
    s += '<rect class="bg" data-tip="' + y + ': ' + fmt(by[y]) + ' waypoints" x="' + (i * bw + bw * 0.15).toFixed(2) + '%" y="0" width="' + (bw * 0.7).toFixed(2) + '%" height="150" fill="transparent"></rect>';
    s += '<rect x="' + (i * bw + bw * 0.15).toFixed(2) + '%" y="' + (130 - h).toFixed(1) + '" width="' + (bw * 0.7).toFixed(2) + '%" height="' + h.toFixed(1) + '" rx="3" fill="var(--accent)" pointer-events="none"></rect>';
    s += '<text x="' + (i * bw + bw * 0.5).toFixed(2) + '%" y="145" text-anchor="middle">' + y.slice(2) + '</text>';
    if (by[y] === max) s += '<text class="v" x="' + (i * bw + bw * 0.5).toFixed(2) + '%" y="' + Math.max(11, 124 - h).toFixed(1) + '" text-anchor="middle">' + fmt(by[y]) + '</text>';
  });
  const d = el('div', 'bars', '<svg viewBox="0 0 800 152" preserveAspectRatio="none" style="height:152px">' + s + '</svg>');
  hoverTips(d);
  return d;
}

function catChart(wps) {
  // aggregate by hkey: in "all CAs" mode each CA has its own copy of the category
  const by = new Map();
  for (const w of wps) for (const o of (D.obsByWp.get(w.u) || [])) {
    const c = D.catBy.get(o.c); if (!c) continue;
    const cur = by.get(c.k);
    by.set(c.k, cur ? { l: cur.l, n: cur.n + 1 } : { l: c.l, n: 1 });
  }
  const top = [...by.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 10);
  const max = Math.max(1, ...top.map(t => t[1].n));
  const d = el('div', 'bars');
  let s = '';
  top.forEach(([k, { l, n }], i) => {
    const y = i * 26;
    const w = Math.max(1.2, 52 * n / max);
    const col = (ROOT_META[k.split('.')[0]] || {}).color || 'var(--cat1)';
    s += '<rect class="bg" data-tip="' + esc(l) + ': ' + fmt(n) + '" x="0" y="' + y + '" width="100%" height="24" fill="transparent"></rect>';
    s += '<text x="0" y="' + (y + 16) + '" pointer-events="none">' + esc(l) + '</text>';
    s += '<rect x="30%" y="' + (y + 6) + '" width="' + w + '%" height="12" rx="3" fill="' + col + '" pointer-events="none"></rect>';
    s += '<text class="v" x="' + (31.5 + w) + '%" y="' + (y + 16) + '" pointer-events="none">' + fmt(n) + '</text>';
  });
  d.innerHTML = '<svg viewBox="0 0 800 ' + (top.length * 26) + '" preserveAspectRatio="none" style="height:' + (top.length * 26) + 'px">' + s + '</svg>';
  hoverTips(d);
  return d;
}

/* ---------------- shared tooltip ---------------- */
function hoverTips(root) {
  root.addEventListener('mousemove', e => {
    const t = e.target.closest('[data-tip]');

}
function showTip(html, x, y) {
  const tip = $('#tip'); tip.innerHTML = html; tip.hidden = false;
  const vw = innerWidth, r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, vw - r.width - 8) + 'px';
  tip.style.top = Math.max(8, y - r.height - 10) + 'px';
}
function hideTip() { $('#tip').hidden = true; }

let patrolQuery = '', patrolShown = 60;
function rPatrols(v) {
  const box = el('div');

  inp.oninput = () => { patrolQuery = inp.value.toLowerCase(); patrolShown = 60; drawRows(); };
  box.appendChild(searchWrap);
  const wrap = el('div', 'tableWrap'); box.appendChild(wrap);
  const moreB = el('button', 'more', 'Show more'); box.appendChild(moreB);
  moreB.onclick = () => { patrolShown += 120; drawRows(); };
  v.appendChild(box);
  function matches(p) {
    if (!patrolQuery) return true;
    const hay = (p.id + ' ' + p.tm + ' ' + p.st + ' ' + (p.legs || []).map(l =>
      l.md + ' ' + l.tr + ' ' + (l.members || []).map(m => m.n).join(' ')).join(' ')).toLowerCase();
    return hay.includes(patrolQuery);
  }
  function drawRows() {
    const list = D.patrols.filter(p => caOk(p.ca) && matches(p));
    let h = '<table><thead><tr><th>Patrol</th><th>Dates</th><th>CA</th><th>Mandate</th><th>Team / members</th><th class="num">Waypoints</th></tr></thead><tbody>';
    for (const p of list.slice(0, patrolShown)) {
      const l0 = (p.legs || [])[0] || {};
      const mem = (l0.members || []);
      const lead = mem.find(m => m.ldr);
      h += '<tr class="click" data-p="' + p.u + '"><td class="mono">' + esc(p.id) + '</td>' +
        '<td class="num">' + p.sd + (p.ed !== p.sd ? ' → ' + p.ed : '') + '</td>' +
        '<td>' + esc(p.ca) + '</td><td>' + esc(l0.md || '') + '</td>' +
        '<td>' + esc(lead ? lead.n + (mem.length > 1 ? ' +' + (mem.length - 1) : '') : (mem[0] ? mem[0].n + (mem.length > 1 ? ' +' + (mem.length - 1) : '') : '')) + '</td>' +
        '<td class="num">' + p.nwp + '</td></tr>';
    }
    h += '</tbody></table>';
    wrap.innerHTML = '<p class="tiny">' + fmt(list.length) + ' patrols</p>' + h;
    moreB.hidden = list.length <= patrolShown;
    wrap.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => patrolDrawer(tr.dataset.p));

  drawRows();
}

async function ensureTracks() {
  if (D.tracks) return;
  const rows = await getJSON('tracks');
  D.tracks = new Map(rows.map(r => [r.p, r.g.map(asGeom)]));
}

async function patrolDrawer(pu) {
  const p = D.patrolBy.get(pu);
  const d = openDrawer();
  d.insertAdjacentHTML('beforeend', '<h3>Patrol <span class="mono">' + esc(p.id) + '</span></h3>');
  const kv = [['Conservation area', (D.caById.get(p.ca) || {}).n || p.ca],
    ['Dates', p.sd + ' → ' + p.ed], ['Type', p.ty], ['Armed', p.armed ? 'yes' : 'no'],
    ['Team', p.tm || '—'], ['Station', p.st || '—'], ['Waypoints', fmt(p.nwp)]];
  if (p.obj) kv.push(['Objective', p.obj]);
  d.insertAdjacentHTML('beforeend', '<div class="kv">' + kv.map(x => '<div>' + esc(x[0]) + '</div><div>' + esc(x[1]) + '</div>').join('') + '</div>');
  for (const leg of (p.legs || [])) {

      '<p>' + (leg.members || []).map(m => esc(m.n) + (m.ldr ? ' <span class="pill lead">leader</span>' : '')).join(', ') + '</p>');
  }
  // mini map: this patrol's waypoints and track

  miniMap(d, wps, lines);
  d.insertAdjacentHTML('beforeend', '<p class="tiny">Waypoints colored by observation group; orange line is the recorded GPS track. ' + esc(BASEMAPS[BASEMAP].attr) + '</p>');
  // observations at each waypoint
  d.insertAdjacentHTML('beforeend', '<h2>Waypoints & observations</h2>');
  const list = el('div');
  for (const w of wps.slice().sort((a, b) => a.t < b.t ? -1 : 1)) {

      w.y.toFixed(5) + ', ' + w.x.toFixed(5) + '</span><span class="mi go" aria-hidden="true">chevron_right</span></div>' +
      os.map(obsHtml).join('');

}

function obsHtml(o) {
  const c = D.catBy.get(o.c);
  const root = ROOT_META[rootOf(o.c)] || {};
  let h = '<div style="margin:5px 0 2px"><span class="dot" style="background:' + (root.color || 'var(--ink-3)') + '"></span><b>' + esc(c ? c.l : '?') + '</b>' +
    (o.e ? ' <span class="tiny">observed by ' + esc(o.e) + '</span>' : '') + '</div>';

}

/* ---------------- Map ---------------- */
// DuckDB's COPY TO json writes ST_AsGeoJSON output as a nested object, not a string
const asGeom = g => typeof g === 'string' ? JSON.parse(g) : g;
const geomLines = g => {
  if (!g) return [];
  if (g.type === 'LineString') return [g.coordinates];
  if (g.type === 'MultiLineString') return g.coordinates;
  return [];
};
const geomRings = g => {
  if (!g) return [];
  if (g.type === 'Polygon') return g.coordinates;
  if (g.type === 'MultiPolygon') return g.coordinates.flat();
  return [];
};

let mapHidden = {}; // root -> bool
function rMap(v) {
  const bar = el('div', 'panel filterbar');
  bar.appendChild(tfControls(() => draw()));
  const countS = el('span', 'tiny'); countS.style.marginLeft = 'auto';
  bar.appendChild(countS);
  v.appendChild(bar);
  const roots = Object.keys(ROOT_META);
  const leg = el('div', 'legend');
  leg.innerHTML = roots.map(r => '<button data-r="' + r + '" class="' + (mapHidden[r] ? 'off' : '') + '">' +
    '<span class="dot" style="background:' + ROOT_META[r].color + '"></span>' + esc(ROOT_META[r].label) + '</button>').join('') +
    '<span class="tiny" style="align-self:center">click to toggle · drag to pan · scroll to zoom · click a point for details</span>';
  const bmIcon = el('span', 'mi'); bmIcon.textContent = 'layers';
  bmIcon.style.marginLeft = 'auto'; bmIcon.setAttribute('aria-hidden', 'true');
  leg.appendChild(bmIcon);
  const bmSel = el('select'); bmSel.id = 'bmSel';
  for (const [k, b] of Object.entries(BASEMAPS)) bmSel.appendChild(new Option(b.label, k));
  bmSel.value = BASEMAP;
  leg.appendChild(bmSel);
  v.appendChild(leg);
  const attr = el('p', 'tiny'); attr.id = 'bmAttr';
  attr.textContent = BASEMAPS[BASEMAP].attr;
  const box = el('div', null); box.id = 'mapBox';
  const cv = el('canvas', 'map'); cv.style.height = 'min(72vh, 640px)';
  box.appendChild(cv); v.appendChild(box); v.appendChild(attr);
  const wps = wpsFiltered();
  const polys = D.bounds.filter(b => caOk(b.ca)).map(b => ({ rings: geomRings(asGeom(b.g)), ty: b.ty, k: b.k }));
  const mm = makeMap(cv, { polys });
  const draw = () => {
    mm.begin();
    mm.drawPolys();
    const pts = wps.filter(w => !mapHidden[w.root] && timeOk(w));
    mm.drawPoints(pts);
    mm.pts = pts;
    countS.textContent = fmt(pts.length) + ' of ' + fmt(wps.length) + ' waypoints shown';
  };
  mm.onredraw = draw;
  mm.fitTo(wps.length ? wps : null);
  draw();
  leg.querySelectorAll('button[data-r]').forEach(b => b.onclick = () => {
    mapHidden[b.dataset.r] = !mapHidden[b.dataset.r];
    b.classList.toggle('off', !!mapHidden[b.dataset.r]); draw();
  });
  bmSel.onchange = () => {
    BASEMAP = bmSel.value;
    try { localStorage.setItem('basemap', BASEMAP); } catch (e) {}
    attr.textContent = BASEMAPS[BASEMAP].attr;
    draw();
  };
  cv.addEventListener('mousemove', e => {
    const w = mm.hit(e); if (w) showTip('<b>' + w.t + '</b><br>' + ((D.obsByWp.get(w.u) || []).map(o => esc((D.catBy.get(o.c) || {}).l)).join('<br>') || 'no observations'), e.clientX, e.clientY);
    else hideTip();
  });
  cv.addEventListener('click', e => {
    const w = mm.hit(e); if (!w) return;
    wpDrawer(w);
  });
}

/* ------- basemap tiles (Web Mercator) ------- */
const BASEMAPS = {
  none:      { label: 'No basemap', attr: '' },
  streets:   { label: 'Streets (OSM)', max: 19, attr: '© OpenStreetMap contributors',
               url: (z, x, y) => 'https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png' },
  satellite: { label: 'Satellite (Esri)', max: 19, attr: 'Imagery © Esri, Maxar, Earthstar Geographics',
               url: (z, x, y) => 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x },
};
let BASEMAP = 'streets';
try { BASEMAP = localStorage.getItem('basemap') || 'streets'; } catch (e) {}
if (!BASEMAPS[BASEMAP]) BASEMAP = 'streets';
const TILE_CACHE = new Map();     // url -> {img, ok}
const TILE_LISTENERS = new Set(); // redraw callbacks for tiles arriving
function getTile(bm, z, x, y) {
  const url = bm.url(z, x, y);
  let t = TILE_CACHE.get(url);
  if (!t) {
    t = { img: new Image(), ok: false };
    t.img.onload = () => { t.ok = true; TILE_LISTENERS.forEach(f => f()); };
    t.img.src = url;
    TILE_CACHE.set(url, t);
  }
  return t;
}
// lon/lat -> Web Mercator world fraction [0,1]
const mercX = lon => (lon + 180) / 360;
const mercY = lat => {
  const s = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);
  return Math.min(1, Math.max(0, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)));
};

/* canvas map factory: Web Mercator, tiled basemap, pan + wheel zoom, point hit-testing */
function makeMap(cv, layers) {
  const ctx = cv.getContext('2d');
  const st = { cx: 0.5, cy: 0.5, world: 512 }; // center (merc) + world width in CSS px
  let dpr = devicePixelRatio || 1;
  const css = getComputedStyle(document.documentElement);
  const colOf = v => v && v.startsWith('var(') ? css.getPropertyValue(v.slice(4, -1)).trim() : v;
  const schedule = (() => { let raf = 0; return () => { if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; if (api.onredraw) api.onredraw(); }); }; })();
  TILE_LISTENERS.add(schedule);
  function resize() {
    dpr = devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    const w = Math.max(50, Math.round(r.width * dpr)), h = Math.max(50, Math.round(r.height * dpr));
    if (w === cv.width && h === cv.height) { schedule(); return; } // no size change: redraw without clearing
    cv.width = w; cv.height = h; // (reassigning size clears the backing store)
    schedule();
  }
  const W = () => st.world * dpr; // world width in device px
  function proj(lon, lat) {
    return [cv.width / 2 + (mercX(lon) - st.cx) * W(),
            cv.height / 2 + (mercY(lat) - st.cy) * W()];
  }
  const unprojM = (px, py) => [st.cx + (px - cv.width / 2) / W(), st.cy + (py - cv.height / 2) / W()];
  const api = {
    pts: [], onredraw: null,
    fitTo(wps) {
      let xs = [], ys = [];
      if (wps) for (const w of wps) {
        if (!hasGps(w)) continue;
        xs.push(mercX(w.x)); ys.push(mercY(w.y));
      }
      else for (const p of (layers.polys || [])) for (const ring of p.rings) for (const c of ring) {
        if (!hasGps({ x: c[0], y: c[1] })) continue;
        xs.push(mercX(c[0])); ys.push(mercY(c[1]));
      }
      const r = cv.getBoundingClientRect();
      if (!xs.length) { st.cx = 0.5; st.cy = 0.5; st.world = 512; return; } // nothing to fit: whole world
      xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
      // 2nd–98th percentile: robust to GPS junk and the demo CA on another continent
      const q = (a, p) => a[Math.min(a.length - 1, Math.floor(p * a.length))];
      const x0 = q(xs, 0.02), x1 = q(xs, 0.98), y0 = q(ys, 0.02), y1 = q(ys, 0.98);
      st.cx = (x0 + x1) / 2; st.cy = (y0 + y1) / 2;
      // floor the span so a single point (or a tight cluster) gets neighborhood
      // context (~10km) instead of zooming to sub-meter
      const spanX = Math.max(x1 - x0, 4e-4), spanY = Math.max(y1 - y0, 4e-4);
      st.world = Math.min(256 * 2 ** 21, 0.9 * Math.min(r.width / spanX, r.height / spanY));
    },
    begin() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = colOf('var(--surface)'); ctx.fillRect(0, 0, cv.width, cv.height);
      api.drawTiles();
    },
    drawTiles() {
      const bm = BASEMAPS[BASEMAP];
      if (!bm.url) return;
      const w = W();
      const z = Math.max(0, Math.min(bm.max, Math.round(Math.log2(w / 256))));
      const n = 1 << z, ts = w / n;
      const left = st.cx * w - cv.width / 2, top = st.cy * w - cv.height / 2;
      const ty0 = Math.max(0, Math.floor(top / ts)), ty1 = Math.min(n - 1, Math.floor((top + cv.height) / ts));
      for (let tx = Math.floor(left / ts); tx <= Math.floor((left + cv.width) / ts); tx++) {
        for (let ty = ty0; ty <= ty1; ty++) {
          const t = getTile(bm, z, ((tx % n) + n) % n, ty);
          if (t.ok) ctx.drawImage(t.img, tx * ts - left, ty * ts - top, ts + 0.5, ts + 0.5);
        }
      }
    },
    drawPolys() {
      const onTiles = !!BASEMAPS[BASEMAP].url;
      for (const p of (layers.polys || [])) {
        ctx.beginPath();
        for (const ring of p.rings) {
          ring.forEach((c, i) => { const [px, py] = proj(c[0], c[1]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
          ctx.closePath();
        }
        if (p.ty === 'CA') { ctx.strokeStyle = colOf('var(--accent)'); ctx.lineWidth = 1.6 * dpr; }
        else { ctx.strokeStyle = onTiles ? 'rgba(70,70,70,0.4)' : colOf('var(--line)'); ctx.lineWidth = 0.7 * dpr; }
        ctx.stroke();
      }
    },
    drawLines(lines, color) {
      ctx.strokeStyle = color || colOf('var(--track)'); // ER Patrol Status / Track Line
      ctx.lineWidth = 1.6 * dpr;
      for (const ln of lines) {
        ctx.beginPath();
        ln.forEach((c, i) => { const [px, py] = proj(c[0], c[1]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
        ctx.stroke();
      }
    },
    drawPoints(wps) {
      const r = 2.6 * dpr;
      const halo = !!BASEMAPS[BASEMAP].url; // white ring keeps dots legible on imagery
      const groups = new Map();
      for (const w of wps) { const k = w.root || '_'; let a = groups.get(k); if (!a) groups.set(k, a = []); a.push(w); }
      for (const [k, arr] of groups) {
        ctx.fillStyle = colOf((ROOT_META[k] || {}).color || 'var(--ink-3)');
        ctx.beginPath();
        for (const w of arr) { const [px, py] = proj(w.x, w.y); if (px < -9 || py < -9 || px > cv.width + 9 || py > cv.height + 9) continue; ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, 7); }
        if (halo) { ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1 * dpr; ctx.stroke(); }
        ctx.fill();
      }
    },
    hit(e) {
      const rect = cv.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * dpr, my = (e.clientY - rect.top) * dpr;
      let best = null, bd = (8 * dpr) ** 2;
      for (const w of api.pts) {
        const [px, py] = proj(w.x, w.y);
        const d2 = (px - mx) ** 2 + (py - my) ** 2;
        if (d2 < bd) { bd = d2; best = w; }
      }
      return best;
    }
  };
  // interactions
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: st.cx, cy: st.cy }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    st.cx = drag.cx - (e.clientX - drag.x) / st.world;
    st.cy = drag.cy - (e.clientY - drag.y) / st.world;
    schedule();
  });
  cv.addEventListener('pointerup', () => drag = null);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    const px = (e.clientX - rect.left) * dpr, py = (e.clientY - rect.top) * dpr;
    const [ax, ay] = unprojM(px, py); // anchor stays under the cursor
    st.world = Math.min(256 * 2 ** 21, Math.max(256, st.world * Math.exp(-e.deltaY * 0.0015)));
    const [bx, by] = unprojM(px, py);
    st.cx += ax - bx; st.cy += ay - by;
    schedule();
  }, { passive: false });
  new ResizeObserver(resize).observe(cv);
  resize();
  return api;
}

function drawMiniMap(cv, wps, lines) {
  const mm = makeMap(cv, { polys: [] });
  const draw = () => {
    mm.begin();
    if (lines.length) mm.drawLines(lines);
    mm.drawPoints(wps);
    mm.pts = wps;
  };
  mm.onredraw = draw;
  mm.fitTo(wps.length ? wps : null);
  draw();
  cv.addEventListener('mousemove', e => {
    const w = mm.hit(e);
    if (w) showTip('<b>' + w.t + '</b>', e.clientX, e.clientY); else hideTip();
  });
  return { mm, draw };
}

// mini-map with an in-map basemap switcher; appends itself to `container`.
// height: CSS height for the canvas (default 300px).
function miniMap(container, wps, lines, height) {
  const frame = el('div', 'mapframe');
  const cv = el('canvas', 'map'); cv.style.height = height || '300px';
  frame.appendChild(cv);
  const ctrl = el('div', 'mapctrl');
  ctrl.innerHTML = '<span class="mi" aria-hidden="true">layers</span>';
  const sel = el('select'); sel.setAttribute('aria-label', 'Basemap');
  for (const [k, b] of Object.entries(BASEMAPS)) sel.appendChild(new Option(b.label, k));
  sel.value = BASEMAP;
  ctrl.appendChild(sel); frame.appendChild(ctrl);
  container.appendChild(frame); // in the DOM before building the map (fit needs layout)
  const { draw } = drawMiniMap(cv, wps, lines || []);
  sel.onchange = () => {
    BASEMAP = sel.value;                       // shared with the Map tab
    try { localStorage.setItem('basemap', BASEMAP); } catch (e) {}
    draw();
  };
  return frame;
}

/* ---------------- Observations ---------------- */
let selCat = null, obsShown = 40, obsQuery = '';
let tfMode = 'off', tfFrom = '', tfTo = '', tfCenter = '', tfDelta = 24, tfUnit = 'h';

function timeOk(w) {
  if (tfMode === 'range') {
    const d = w.t.slice(0, 10);
    if (tfFrom && d < tfFrom) return false;
    if (tfTo && d > tfTo) return false;
    return true;
  }
  if (tfMode === 'around') {
    if (!tfCenter) return true;
    const c = centerEpoch();
    if (isNaN(c) || isNaN(w.ep)) return false;
    return Math.abs(w.ep - c) <= tfDelta * ({ m: 60e3, h: 3600e3, d: 86400e3 }[tfUnit]);
  }
  return true;
}
// the "around" timestamp is interpreted in the data's timezone, not the browser's
const dataTz = () => CA !== 'all' ? tzFor(CA) : (D.tz ? D.tz.default : null);
let _ce = { key: null, ep: NaN };
function centerEpoch() {
  const key = tfCenter + '|' + (dataTz() || 'local');
  if (_ce.key !== key) _ce = { key, ep: wallToEpoch(tfCenter, dataTz()) };
  return _ce.ep;
}
// searchable text per observation, built lazily and cached
function obsText(o) {
  if (o._s === undefined) {
    const c = D.catBy.get(o.c);
    o._s = ((c ? c.l + ' ' + c.k : '') + ' ' + (o.e || '') + ' ' +
      (o.a || []).map(a => a[0] + ' ' + a[1]).join(' ')).toLowerCase();
  }
  return o._s;
}

/* shared time-filter controls, mounted by both the Observations and Map tabs */
function tfControls(onchange) {
  const wrap = el('span', 'tfwrap');
  wrap.innerHTML =

    '<select id="tfMode"><option value="off">All dates</option><option value="range">Date range</option><option value="around">Around a time</option></select>' +
    '<span id="tfRange"><input type="date" id="tfFrom" value="' + tfFrom + '"> <span class="tiny">to</span> <input type="date" id="tfTo" value="' + tfTo + '"></span>' +
    '<span id="tfAround"><input type="datetime-local" id="tfCenter" value="' + tfCenter + '"> <span class="tiny">±</span> ' +
      '<input type="number" id="tfDelta" min="1" value="' + tfDelta + '" style="width:72px">' +
      '<select id="tfUnit"><option value="m">minutes</option><option value="h">hours</option><option value="d">days</option></select></span>' +
    '<span class="tiny" id="tzHint"></span>';
  $('#tfMode', wrap).value = tfMode; $('#tfUnit', wrap).value = tfUnit;
  const sync = () => {
    $('#tfRange', wrap).hidden = tfMode !== 'range';
    $('#tfAround', wrap).hidden = tfMode !== 'around';
    $('#tzHint', wrap).textContent = tfMode === 'off' ? '' :
      'times in ' + (dataTz() || 'browser-local time (run ./smart-able browse to infer zones from GPS)');
  };
  let deb;
  const later = () => { clearTimeout(deb); deb = setTimeout(onchange, 200); };
  $('#tfMode', wrap).onchange = e => { tfMode = e.target.value; sync(); onchange(); };
  $('#tfFrom', wrap).onchange = e => { tfFrom = e.target.value; onchange(); };
  $('#tfTo', wrap).onchange = e => { tfTo = e.target.value; onchange(); };
  $('#tfCenter', wrap).onchange = e => { tfCenter = e.target.value; onchange(); };
  $('#tfDelta', wrap).oninput = e => { tfDelta = +e.target.value || 0; later(); };
  $('#tfUnit', wrap).onchange = e => { tfUnit = e.target.value; onchange(); };
  sync();
  return wrap;
}

function rObs(v) {
  const bar = el('div', 'panel filterbar');
  const { wrap: searchWrap, inp: search } = searchField('obsSearch',
    'Search category, attribute, value, observer…', obsQuery);
  bar.appendChild(searchWrap);
  bar.appendChild(tfControls(() => { obsShown = 40; update(); }));
  const clearB = el('button', 'ghost');
  clearB.innerHTML = '<span class="mi" aria-hidden="true">close</span>Clear';
  clearB.style.marginTop = '0'; bar.appendChild(clearB);
  const countS = el('span', 'tiny'); countS.id = 'obsCount'; bar.appendChild(countS);
  v.appendChild(bar);
  const cols = el('div', 'cols'); v.appendChild(cols);
  const treeP = el('div', 'panel tree'); cols.appendChild(treeP);
  const listP = el('div', 'panel'); cols.appendChild(listP);

  let deb;
  search.oninput = e => {
    obsQuery = e.target.value; obsShown = 40;
    clearTimeout(deb); deb = setTimeout(update, 200);
  };
  clearB.onclick = () => {
    obsQuery = ''; tfMode = 'off'; tfFrom = tfTo = tfCenter = ''; selCat = null; obsShown = 40; render();
  };

  function update() {
    const q = obsQuery.trim().toLowerCase();
    const filtering = q || tfMode !== 'off';
    const match = [];
    for (const o of D.obs) {
      const w = D.wpBy.get(o.w);
      if (!w || !caOk(w.ca) || !timeOk(w)) continue;
      if (q && !obsText(o).includes(q)) continue;
      match.push(o);
    }
    countS.textContent = fmt(match.length) + ' observations match';
    // tree with counts incl. descendants (hkey prefix credit)
    const cnt = new Map();
    for (const o of match) {
      const c = D.catBy.get(o.c); if (!c) continue;
      const parts = c.k.replace(/\.$/, '').split('.');
      let k = '';
      for (const p of parts) { k += p + '.'; cnt.set(k, (cnt.get(k) || 0) + 1); }
    }
    treeP.innerHTML = '';
    treeP.appendChild(el('h2', null, 'Data model categories'));
    const byParent = new Map();
    for (const c of D.cats) {
      const key = c.p || '_root';
      let a = byParent.get(key); if (!a) byParent.set(key, a = []);
      a.push(c);
    }
    const seenHkey = new Set();
    (function addNodes(parentKey, depth, host) {
      for (const c of (byParent.get(parentKey) || [])) {
        const n = cnt.get(c.k) || 0;
        if (!n) continue;
        if (seenHkey.has(c.k)) continue; // two CAs share hkeys; show once in "all" mode
        seenHkey.add(c.k);
        const d = el('div', 'nd' + (selCat === c.k ? ' sel' : ''));
        d.style.paddingLeft = (depth * 16) + 'px';
        d.innerHTML = esc(c.l) + ' <span class="cnt">' + fmt(n) + '</span>';
        d.onclick = () => { selCat = selCat === c.k ? null : c.k; obsShown = 40; update(); };
        host.appendChild(d);
        addNodes(c.u, depth + 1, host);
      }
    })('_root', 0, treeP);
    // right: observation list — a category, or all matches when filters are active
    let list = selCat ? match.filter(o => { const c = D.catBy.get(o.c); return c && c.k.startsWith(selCat); })
                      : (filtering ? match : []);
    list = list.slice().sort((a, b) => {
      const wa = D.wpBy.get(a.w), wb = D.wpBy.get(b.w);
      return (wb ? wb.t : '') < (wa ? wa.t : '') ? -1 : 1; // newest first
    });
    listP.innerHTML = '';
    const title = selCat ? ((D.cats.find(c => c.k === selCat) || {}).l || selCat)
                         : (filtering ? 'All matching categories' : 'Pick a category');
    listP.appendChild(el('h2', null, esc(title) + (list.length ? ' — ' + fmt(list.length) + ' observations' : '')));
    if (!list.length) {
      listP.appendChild(el('p', 'muted', filtering
        ? 'Nothing matches the current filters.'
        : 'Pick a category on the left, or type a search / set a time filter to list observations across all categories. Counts include subcategories.'));
      return;
    }
    const host = el('div'); listP.appendChild(host);
    (function drawList() {
      host.innerHTML = '';
      for (const o of list.slice(0, obsShown)) {
        const w = D.wpBy.get(o.w);
        const h = el('div');
        h.style.cssText = 'border-top:1px solid var(--line);padding:8px 0';
        h.innerHTML = '<span class="mono">' + (w ? w.t : '?') + '</span> ' +
          (w ? '<span class="tiny num">' + w.y.toFixed(4) + ', ' + w.x.toFixed(4) + '</span>' : '') + obsHtml(o);
        if (w) { h.classList.add('click'); h.style.cursor = 'pointer'; h.onclick = () => wpDrawer(w); }
        host.appendChild(h);
      }
      if (list.length > obsShown) {
        const b = el('button', 'more', 'Show more'); b.onclick = () => { obsShown += 80; drawList(); };
        host.appendChild(b);
      }
    })();
  }
  update();
}

let selType = null, entShown = 50, entQuery = '';
function rProfiles(v) {

  bar.appendChild(searchWrap);
  const clearB = el('button', 'ghost');
  clearB.innerHTML = '<span class="mi" aria-hidden="true">close</span>Clear';
  clearB.style.marginTop = '0'; bar.appendChild(clearB);
  const countS = el('span', 'tiny'); bar.appendChild(countS);
  v.appendChild(bar);
  const cols = el('div', 'cols'); v.appendChild(cols);
  const left = el('div', 'panel'); cols.appendChild(left);
  const right = el('div', 'panel'); cols.appendChild(right);

  let deb;
  search.oninput = e => {
    entQuery = e.target.value; entShown = 50;
    clearTimeout(deb); deb = setTimeout(update, 200);
  };
  clearB.onclick = () => { entQuery = ''; selType = null; entShown = 50; render(); };

  function update() {
    const q = entQuery.trim().toLowerCase();
    const matched = q ? ents0.filter(e => entText(e).includes(q)) : ents0;
    countS.textContent = q ? fmt(matched.length) + ' of ' + fmt(ents0.length) + ' entities match' : '';
    const byKey = new Map();
    for (const e of matched) {
      const k = keyOf(e);
      let a = byKey.get(k); if (!a) byKey.set(k, a = []); a.push(e);
    }
    if (selType && !byKey.has(selType)) selType = null;

    left.innerHTML = '';
    left.appendChild(el('h2', null, 'Entity types'));
    const tree = el('div', 'tree'); left.appendChild(tree);
    const keys = [...byKey.keys()].sort((a, b) => byKey.get(b).length - byKey.get(a).length);
    for (const k of keys) {
      const d = el('div', 'nd' + (selType === k ? ' sel' : ''),
        esc(labelOf(k)) + ' <span class="cnt">' + fmt(byKey.get(k).length) + '</span>');
      d.onclick = () => { selType = selType === k ? null : k; entShown = 50; update(); };
      tree.appendChild(d);
    }
    if (!keys.length) left.appendChild(el('p', 'muted', 'No entities match.'));

    const ents = selType ? byKey.get(selType) : matched;
    right.innerHTML = '';
    right.appendChild(el('h2', null, (selType ? esc(labelOf(selType)) : 'All entities') + ' — ' + fmt(ents.length)));
    const host = el('div'); right.appendChild(host);
    const drawEnts = () => {
      host.innerHTML = '<div class="tableWrap"><table><thead><tr><th>Entity</th><th>Type</th>' +
        (allCas ? '<th>Conservation area</th>' : '') + '<th>Created</th><th class="num">Records</th></tr></thead><tbody>' +
        ents.slice(0, entShown).map(e => '<tr class="click" data-i="' + D.profiles.entities.indexOf(e) + '">' +
          '<td>' + esc(e.n) + '</td><td>' + esc(labelOf(keyOf(e))) + '</td>' +
          (allCas ? '<td>' + esc((D.caById.get(e.ca) || {}).n || e.ca || '') + '</td>' : '') +
          '<td class="num">' + profileCreated(e) + '</td><td class="num">' + (e.recs || []).length + '</td></tr>').join('') +
        '</tbody></table></div>';
      if (ents.length > entShown) {
        const b = el('button', 'more', 'Show more'); b.onclick = () => { entShown += 100; drawEnts(); };
        host.appendChild(b);
      }
      host.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => entityDrawer(+tr.dataset.i));
    };
    drawEnts();
  }
  update();
}

// searchable text per entity, built lazily and cached: name, type, CA,
// attributes, comment, and its linked records' titles, sources, and statuses
function entText(e) {
  if (e._s === undefined) {
    const ty = D.ptypeBy.get(e.ty) || {};
    const ca = D.caById.get(e.ca) || {};
    const recs = (e.recs || []).map(u => D.recBy.get(u)).filter(Boolean);
    e._s = [e.n, ty.l, ty.k, ca.n, e.ca, profileCreated(e), e.cmt,
      ...(e.vals || []).map(x => x[0] + ' ' + x[1]),
      ...recs.map(r => r.title + ' ' + r.src + ' ' + r.status)].filter(Boolean).join(' ').toLowerCase();
  }
  return e._s;
}

function entityDrawer(i, from) {   // from: {record, scroll} when opened from a record drawer
  const e = D.profiles.entities[i];
  const d = openDrawer();
  if (from && from.record) {
    const r = D.recBy.get(from.record);
    backButton(d, 'Back to record ' + esc(r ? r.title || '(untitled)' : ''), () => recordDrawer(from.record), from.scroll);
  }
  d.insertAdjacentHTML('beforeend', '<h3>' + esc(e.n) + '</h3><p class="tiny">' +
    esc((D.ptypeBy.get(e.ty) || {}).l || '') + ' · ' + esc((D.caById.get(e.ca) || {}).n || e.ca || '') +
    ' · created ' + (profileCreated(e) || '?') + '</p>');
  const vals = (e.vals || []).filter(x => x[1] !== '');
  if (vals.length) d.insertAdjacentHTML('beforeend', '<div class="kv">' +
    vals.map(x => '<div>' + esc(x[0]) + '</div><div>' + esc(x[1]) + '</div>').join('') + '</div>');
  if (e.cmt) d.insertAdjacentHTML('beforeend', '<p>' + esc(e.cmt) + '</p>');
  const eph = photoStrip(D.attBy.ent.get(e.u));
  if (eph) { d.insertAdjacentHTML('beforeend', '<h2>Attachments</h2>'); d.appendChild(eph); }
  const recs = (e.recs || []).map(u => D.recBy.get(u)).filter(Boolean);
  d.insertAdjacentHTML('beforeend', '<h2>Linked records (' + recs.length + ')</h2>');
  for (const r of recs.sort((a, b) => (a.d || '') < (b.d || '') ? 1 : -1)) {
    const row = el('div', 'click');
    row.style.cssText = 'border-top:1px solid var(--line);padding:8px 0';
    row.innerHTML = '<b>' + esc(r.title || '(untitled)') + '</b> <span class="pill">' + esc(r.src) + '</span>' +
      (r.status ? ' <span class="pill">' + esc(r.status) + '</span>' : '') + ' <span class="tiny num">' + (r.d || '') + '</span>' +
      (r.descr ? '<div class="tiny">' + esc(r.descr.length > 200 ? r.descr.slice(0, 200) + '…' : r.descr) + '</div>' : '');
    row.title = 'Open this record';
    row.onclick = () => recordDrawer(r.u, { entity: i, scroll: d.scrollTop });
    d.appendChild(row);
  }
  if (!recs.length) d.insertAdjacentHTML('beforeend', '<p class="muted">No linked records.</p>');
}

// A Profiles record: a dated event with its record-source attributes, text,
// photos, and the entities it is linked to (many-to-many).
function recordDrawer(u, from) {   // from: {entity, scroll} when opened from an entity drawer
  const r = D.recBy.get(u);
  if (!r) return;
  const d = openDrawer();
  if (from && from.entity != null) {
    const e = D.profiles.entities[from.entity];
    backButton(d, 'Back to ' + esc(e ? e.n : 'entity'), () => entityDrawer(from.entity), from.scroll);
  }
  d.insertAdjacentHTML('beforeend', '<h3>' + esc(r.title || '(untitled)') + '</h3><p class="tiny">' +
    [r.src, r.status, r.d, (D.caById.get(r.ca) || {}).n || r.ca].filter(Boolean).map(esc).join(' · ') + '</p>');
  const vals = (r.vals || []).filter(x => x[1] !== '');
  if (vals.length) d.insertAdjacentHTML('beforeend', '<div class="kv">' +
    vals.map(x => '<div>' + esc(x[0]) + '</div><div>' + esc(x[1]) + '</div>').join('') + '</div>');
  if (r.descr) d.insertAdjacentHTML('beforeend', '<p>' + esc(r.descr) + '</p>');
  if (r.cmt) d.insertAdjacentHTML('beforeend', '<p class="muted">' + esc(r.cmt) + '</p>');
  const ph = photoStrip(D.attBy.rec.get(r.u));
  if (ph) { d.insertAdjacentHTML('beforeend', '<h2>Attachments</h2>'); d.appendChild(ph); }
  const ents = (D.recEnts.get(r.u) || []).map(i => [i, D.profiles.entities[i]]);
  d.insertAdjacentHTML('beforeend', '<h2>Linked entities (' + ents.length + ')</h2>');
  for (const [i, e] of ents) {
    const row = el('div', 'click');
    row.style.cssText = 'border-top:1px solid var(--line);padding:8px 0';
    row.innerHTML = '<b>' + esc(e.n) + '</b> <span class="pill">' + esc((D.ptypeBy.get(e.ty) || {}).l || '') + '</span>';
    row.title = 'Open this entity';
    row.onclick = () => entityDrawer(i, { record: r.u, scroll: d.scrollTop });
    d.appendChild(row);
  }
  if (!ents.length) d.insertAdjacentHTML('beforeend', '<p class="muted">Not linked to any entity.</p>');
  const created = profileCreated(r);
  if (created || r.by) d.insertAdjacentHTML('beforeend', '<p class="tiny">Created ' + esc(created || '?') +
    (r.by ? ' by ' + esc(r.by) : '') + '</p>');
}

/* ---------------- Schema ---------------- */
function rSchema(v) {
  v.insertAdjacentHTML('beforeend', `
<div class="panel"><h2>How SMART relates this data</h2>
<div style="overflow-x:auto"><pre class="mono" style="line-height:1.45;margin:0">
conservation_area ─┬─ employee ── agency, rank
                   ├─ team, station, language ── i18n_label (all display names)
                   ├─ dm_category (tree, hkey) ⇄ dm_cat_att_map ⇄ dm_attribute ─ dm_attribute_list / dm_attribute_tree
                   └─ patrol ─┬─ patrol_leg ─┬─ patrol_leg_members ── employee
                              │              └─ patrol_leg_day ─┬─ track (WKB line, no per-point times)
                              │                                 └─ patrol_waypoint ── waypoint (x, y, datetime)
                              └─ (type, mandate, transport reference tables)

waypoint ─┬─ wp_attachments (filenames; files on disk, encrypted)
          └─ wp_observation_group ── wp_observation ─┬─ dm_category   (what was seen)
                                                     ├─ employee      (observer)
                                                     └─ wp_observation_attributes (EAV values)
                                                          └─ number / string / list item / tree node / geometry

PROFILES (i2 plugin)
i_entity ─┬─ i_entity_type (name = value of the type's id_attribute)
          ├─ i_entity_attribute_value ── i_attribute / i_attribute_list_item
          ├─ i_entity_record ── i_record ─┬─ i_recordsource ── i_recordsource_attribute ── i_attribute
          │                               ├─ i_record_attribute_value ── i_record_attribute_value_list ── i_attribute_list_item
          │                               └─ i_record_attachment
          └─ i_entity_attachment / i_entity_location
</pre></div></div>
<div class="panel" style="margin-top:14px"><h2>Reading notes</h2><ul class="schema-notes">
<li><b>Waypoint</b> is the universal location/time record (<code>waypoint.x/y</code> = lon/lat WGS84, <code>datetime</code> local, no timezone). Its <code>source</code> says which tool recorded it (<code>PATROL</code>, <code>INDINC</code> for independent incidents, <code>SMARTCOLLECT</code>, <code>ASSET</code>, <code>SURVEY</code>); this browser shows patrol waypoints.</li>
<li><b>Patrol → leg → leg-day → waypoint</b>: a patrol has legs (team + transport + mandate), legs have days, and <code>patrol_waypoint</code> ties each waypoint to a leg-day. Tracks (<code>track.geometry</code>, JTS WKB) hang off the leg-day and have no per-point timestamps.</li>
<li><b>Observations are EAV</b>: <code>wp_observation</code> points at a <code>dm_category</code> (hierarchical <code>hkey</code> like <code>threats.cuttingoftrees.</code>); values live in <code>wp_observation_attributes</code> as number / string / list-item / tree-node / geometry, defined by <code>dm_attribute</code>.</li>
<li><b>Names are i18n</b>: every label on this page comes from <code>i18n_label (language_uuid, element_uuid, value)</code> joined on the row's UUID, using each CA's default language.</li>
<li><b>Profiles</b> (<code>i2</code> plugin): <code>i_entity</code> rows are persistent subjects typed by <code>i_entity_type</code>; the entity's display name is the value of the type's <code>id_attribute</code>. Records (<code>i_record</code>) are dated reports linked many-to-many via <code>i_entity_record</code>.</li>
<li><b>Attachments</b> are files under <code>filestore/&lt;ca_uuid&gt;/…</code>, AES-128-CBC encrypted with the CA UUID as key; only filenames are in the DB, so photos are not shown in this browser.</li>
<li>All primary keys are UUIDs (<code>CHAR(16) FOR BIT DATA</code> in Derby, hex strings here). Everything scopes to a conservation area via <code>ca_uuid</code>.</li>
</ul></div>`);
}

/* ---------------- drawer ---------------- */
function openDrawer() {
  const d = $('#drawer'); d.innerHTML = '';
  const x = el('button', 'x'); x.innerHTML = '<span class="mi" aria-hidden="true">close</span>Close';
  x.onclick = closeDrawer;
  d.appendChild(x); d.hidden = false;
  d.scrollTop = 0;
  return d;
}
function closeDrawer() { const d = $('#drawer'); d.hidden = true; d.innerHTML = ''; }
// "Back to …" button at the top of a drawer opened from another drawer;
// reopen() rebuilds the previous one, which is then restored to its scroll position
function backButton(d, label, reopen, scroll) {
  const back = el('button', 'ghost');
  back.style.marginTop = '0';
  back.innerHTML = '<span class="mi" aria-hidden="true">arrow_back</span>' + label;
  back.onclick = async () => { await reopen(); $('#drawer').scrollTop = scroll || 0; };
  d.appendChild(back);
}
document.addEventListener('keydown', e => {
  if (modalState) {
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'ArrowLeft' && modalState.idx > 0) { modalState.idx--; drawModal(); }
    else if (e.key === 'ArrowRight' && modalState.idx < modalState.paths.length - 1) { modalState.idx++; drawModal(); }
    return;
  }
  if (e.key === 'Escape') closeDrawer();
});

boot();
</script>
