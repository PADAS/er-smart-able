<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>smart-able</title>
  <meta name="locales-v" content="{{ locales_v }}">
  <!-- the tokens hang on data-theme, so it is set before anything paints; app.js keeps it in step afterwards -->
  <script>(function () { var t; try { t = localStorage.theme; } catch (e) {} document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; })();</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
  <link rel="stylesheet" href="/static/er-tokens.css?v={{ assets['er-tokens.css'] }}">
  <link rel="stylesheet" href="/static/fonts/roboto.css?v={{ assets['fonts/roboto.css'] }}">
  <link rel="stylesheet" href="/static/app.css?v={{ assets['app.css'] }}">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <header>
    <a id="home" href="#/" title="Back to the dataset list" data-i18n-title="shell.home"><img src="/static/img/er-lockup-white-h-short.svg" alt="EarthRanger"></a><span id="appName" data-i18n="shell.appName">SMART migration</span><span id="version" class="tiny">{{ version }}</span>
    <div class="header-right">
      <select id="lang" class="lang-select" aria-label="Language" data-i18n-aria="shell.language">{% for l in languages %}<option value="{{ l.code }}" lang="{{ l.code }}">{{ l.name }}</option>{% endfor %}</select>
      <button id="helpBtn" class="btn ghost" title="Help" aria-label="Help" data-i18n-title="shell.help" data-i18n-aria="shell.help" hidden><span class="mi" aria-hidden="true">help</span><span class="label" data-i18n="shell.help">Help</span></button>
      <details id="account" hidden>
        <summary id="whoEmail"></summary>
        <div id="accountMenu">
          <p id="menuEmail" class="menu-email"></p>
          <button id="menuSites" class="menu-item"><span class="mi" aria-hidden="true">dns</span><span data-i18n="shell.sites">EarthRanger sites</span></button>
          <fieldset class="menu-theme">
            <legend data-i18n="shell.theme">Theme</legend>
            <label><input type="radio" name="theme" value="system"><span data-i18n="shell.themeSystem">System</span></label>
            <label><input type="radio" name="theme" value="light"><span data-i18n="shell.themeLight">Light</span></label>
            <label><input type="radio" name="theme" value="dark"><span data-i18n="shell.themeDark">Dark</span></label>
          </fieldset>
          <button id="signOut" class="menu-item"><span class="mi" aria-hidden="true">logout</span><span data-i18n="shell.signOut">Sign out</span></button>
          <p class="tiny menu-version">{{ version }}</p>
        </div>
      </details>
    </div>
  </header>
  <p id="langNote" class="lang-note" hidden data-i18n="shell.machineTranslated">This translation was made by machine and has not yet been reviewed by a fluent speaker. If something is unclear, switch to English.</p>
  <div id="crumbs" class="crumbs" hidden></div>

  <main id="page" class="wrap"></main>

  <div id="helpBackdrop" class="backdrop" hidden></div>
  <aside id="help" class="drawer" hidden role="dialog" aria-modal="true" aria-label="Help" data-i18n-aria="shell.help">
    <div class="drawer-head"><h2 data-i18n="shell.help">Help</h2><button class="btn ghost" id="helpClose" title="Close" data-i18n-title="shell.close"><span class="mi" aria-hidden="true">close</span></button></div>
    <nav id="helpToc" class="help-toc"></nav>
    <p id="helpNote" class="tiny help-note" hidden></p>
    <div id="helpBody" class="help-body"></div>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="dialog">
      <h3 id="modalTitle">Share</h3>
      <div id="modalBody"></div>
      <div class="row right" id="modalFoot"><button class="btn ghost" id="modalClose" data-i18n="shell.close">Close</button></div>
    </div>
  </div>

  <script type="application/json" id="languages">{{ languages | tojson }}</script>
  <script src="/static/i18n.js?v={{ assets['i18n.js'] }}"></script>
  <script src="/static/pages.js?v={{ assets['pages.js'] }}"></script>
  <script src="/static/app.js?v={{ assets['app.js'] }}"></script>
</body>
</html>
