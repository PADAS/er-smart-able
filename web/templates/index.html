<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>smart-able</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
  <link rel="stylesheet" href="/static/er-tokens.css?v={{ assets['er-tokens.css'] }}">
  <link rel="stylesheet" href="/static/fonts/roboto.css?v={{ assets['fonts/roboto.css'] }}">
  <link rel="stylesheet" href="/static/app.css?v={{ assets['app.css'] }}">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <header>
    <a id="home" href="#/" title="Back to the dataset list"><img src="/static/img/er-lockup-white-h-short.svg" alt="EarthRanger"></a><span id="appName">SMART migration</span><span id="version" class="tiny">{{ version }}</span>
    <div class="header-right">
      <button id="helpBtn" class="btn ghost" title="Help" aria-label="Help" hidden><span class="mi" aria-hidden="true">help</span><span class="label">Help</span></button>
      <details id="account" hidden>
        <summary id="whoEmail"></summary>
        <div id="accountMenu">
          <button id="menuSites" class="menu-item"><span class="mi" aria-hidden="true">dns</span>EarthRanger sites</button>
          <fieldset class="menu-theme">
            <legend>Theme</legend>
            <label><input type="radio" name="theme" value="system">System</label>
            <label><input type="radio" name="theme" value="light">Light</label>
            <label><input type="radio" name="theme" value="dark">Dark</label>
          </fieldset>
          <button id="signOut" class="menu-item"><span class="mi" aria-hidden="true">logout</span>Sign out</button>
          <p class="tiny menu-version">{{ version }}</p>
        </div>
      </details>
    </div>
  </header>
  <div id="crumbs" class="crumbs" hidden></div>

  <main id="page" class="wrap"></main>

  <div id="helpBackdrop" class="backdrop" hidden></div>
  <aside id="help" class="drawer" hidden role="dialog" aria-modal="true" aria-label="Help">
    <div class="drawer-head"><h2>Help</h2><button class="btn ghost" id="helpClose" title="Close"><span class="mi" aria-hidden="true">close</span></button></div>
    <nav id="helpToc" class="help-toc"></nav>
    <p id="helpNote" class="tiny help-note" hidden></p>
    <div id="helpBody" class="help-body"></div>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="dialog">
      <h3 id="modalTitle">Share</h3>
      <div id="modalBody"></div>
      <div class="row right" id="modalFoot"><button class="btn ghost" id="modalClose">Close</button></div>
    </div>
  </div>

  <script src="/static/pages.js?v={{ assets['pages.js'] }}"></script>
  <script src="/static/app.js?v={{ assets['app.js'] }}"></script>
</body>
</html>
