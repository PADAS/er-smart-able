<!doctype html>
<html lang="{{lang}}" data-langs="{{langs}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · {{site_name}}</title>
  {{alternates}}
  <!-- the tokens hang on data-theme, so it is set before anything paints; it follows the system -->
  <script>(function () { var q = window.matchMedia && matchMedia('(prefers-color-scheme: dark)'); function set() { document.documentElement.dataset.theme = q && q.matches ? 'dark' : 'light'; } set(); if (q && q.addEventListener) q.addEventListener('change', set); })();</script>
  <!-- the reader's language: a remembered choice, or the browser's on a first visit; before anything paints -->
  <script src="{{root}}static/lang.js"></script>
  <link rel="stylesheet" href="{{root}}static/er-tokens.css">
  <link rel="stylesheet" href="{{root}}static/fonts/roboto.css">
  <link rel="stylesheet" href="{{root}}static/site.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html"><img src="{{root}}static/img/er-lockup-white-h-short.svg" alt="EarthRanger"><span>{{site_name}} <span class="sub">· {{subtitle}}</span></span></a>
    <nav class="langs" aria-label="{{language_label}}">{{switcher}}</nav>
  </header>
  <div class="layout">
    <nav aria-label="{{pages_label}}">
{{nav}}
    </nav>
    <main>
      {{note}}
      <h1>{{title}}</h1>
{{body}}
      <div class="prev-next">{{prev_next}}</div>
    </main>
  </div>
  <footer>{{footer}}</footer>
</body>
</html>
